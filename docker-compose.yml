services:
  postgres:
    image: postgres:18
    container_name: log-service-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logpassword}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-loguser} -d ${POSTGRES_DB:-logs}']
      interval: 2s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    command: >
        postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c effective_cache_size=768MB
        -c max_wal_size=2GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB

  pgadmin:
    image: dpage/pgadmin4
    container_name: log-service-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - '5050:80'
    depends_on:
      - postgres

  app:
    build: .
    container_name: log-service-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-loguser}:${POSTGRES_PASSWORD:-logpassword}@postgres:5432/${POSTGRES_DB:-logs}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_INTERVAL_MINUTES: ${RETENTION_INTERVAL_MINUTES:-60}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-5000}
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx node-pg-migrate up && node dist/index.js"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  