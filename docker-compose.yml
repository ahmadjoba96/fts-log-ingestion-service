services:
  postgres:
    image: postgres:18
    container_name: log-service-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: log-service-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
  app:
    build: .
    container_name: log-service-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RETENTION_DAYS: ${RETENTION_DAYS}
      RETENTION_INTERVAL_MINUTES: ${RETENTION_INTERVAL_MINUTES}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE}
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    command: sh -c "npx node-pg-migrate up && node dist/index.js"

volumes:
  pgdata:
  pgadmin_data:
